name: Deploy WanderNotes frontend to Hetzner

on:
  push:
    branches:
      - main
    paths:
        - "frontend/**"
        - ".github/workflows/deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Add Hetzner host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 222 -H "${{ secrets.HETZNER_SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy static frontend
        run: |
          sshpass -p "${{ secrets.HETZNER_SSH_PASSWORD }}" \
          rsync -avz --delete \
            --exclude='uploads/' \
            -e "ssh -p 222" \
            frontend/out/ \
            "${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_SSH_HOST }}:~/backend/public/"